name: Proposal
description: Suggest a change to the boilerplate, its examples or its docs.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you suggest, and the alternatives you considered.
    validations:
      required: true
