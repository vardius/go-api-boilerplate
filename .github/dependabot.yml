version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']
  - package-ecosystem: npm
    directories: [/web, /website]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  # The Dockerfiles and compose files pin exact image tags.
  - package-ecosystem: docker
    directories: [/, /web]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
