name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Six Go images, one per service and store, because the store is a build tag.
  service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth, user]
        store: [memory, mysql, mongodb]
    name: ${{ matrix.service }} (${{ matrix.store }})
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE=${{ matrix.service }}
            STORE=${{ matrix.store }}
            VERSION=${{ env.VERSION }}
          tags: ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ env.VERSION }}-${{ matrix.store }}
          push: true
          provenance: mode=max
          sbom: true

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}-web:${{ env.VERSION }}
          push: true
          provenance: mode=max
          sbom: true

  # The chart is versioned with the images it points at.
  release:
    needs: [service, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Push the Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package deploy/helm/go-api-boilerplate --version "$VERSION" --app-version "$VERSION"
          helm push "go-api-boilerplate-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "go-api-boilerplate-$VERSION.tgz"
