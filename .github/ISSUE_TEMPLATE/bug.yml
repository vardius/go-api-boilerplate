name: Bug report
description: Something in the boilerplate doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps, request or test that shows it.
      placeholder: |
        1. docker compose up --wait
        2. curl …
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Store
      options: [memory, mysql, mongodb, not sure]
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit of this repository you're on (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove any tokens, passwords or personal data first.
      render: text
