version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']
  - package-ecosystem: npm
    directories: [/web, /website]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # typescript-eslint, which lints the web app, accepts only TypeScript
      # below 6.1; lift this once a release of it accepts 7.
      - dependency-name: typescript
        versions: ['>= 7']
  # The Dockerfiles and compose files pin exact image tags.
  - package-ecosystem: docker
    directories: [/, /web]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # MySQL stays on its LTS line (9.7); the calendar-versioned releases
      # (26.7, 26.10, …) are Innovation releases until 28.4 LTS.
      - dependency-name: mysql
        versions: ['>= 10']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
