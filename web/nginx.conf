# The gateway: serves the single-page app and proxies both APIs on one origin,
# so session cookies stay SameSite and nothing needs CORS.
#
# This file is a template. The image copies it to
# /etc/nginx/templates/default.conf.template, and the nginx entrypoint runs
# envsubst over it into /etc/nginx/conf.d/default.conf at startup. Only
# variables set in the environment are replaced:
#   AUTH_UPSTREAM  the auth service, no trailing slash (default http://auth:8080)
#   USER_UPSTREAM  the user service, no trailing slash (default http://user:8080)
# Every other $name below is an nginx variable and is left alone.

# Keep the caller's request ID when it is one the services accept, else mint one,
# so the gateway log and the service logs share it.
map $http_x_request_id $forwarded_request_id {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    default                   $request_id;
}

# Headers for the app's own files. The APIs set their own security and cache
# headers, so these stay empty (and nginx adds nothing) on /api/ responses.
map $uri $app_cache_control {
    ~^/api/     "";
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

# Self only, nothing inline. No form-action: the consent form posts here and
# the answer redirects to the OAuth app's own site, and browsers apply
# form-action to that redirect too.
map $uri $app_csp {
    ~^/api/  "";
    default  "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'";
}

map $uri $app_nosniff {
    ~^/api/  "";
    default  "nosniff";
}

# same-origin keeps the Origin header on the app's own POSTs and sends no
# referrer (sign-in codes live in URLs) to any other site.
map $uri $app_referrer_policy {
    ~^/api/  "";
    default  "same-origin";
}

map $uri $app_permissions_policy {
    ~^/api/  "";
    default  "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()";
}

# The path without its query string: sign-in links carry live codes there.
log_format gateway '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time '
                   'request_id=$forwarded_request_id';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log gateway;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $app_cache_control always;
    add_header Content-Security-Policy $app_csp always;
    add_header X-Content-Type-Options $app_nosniff always;
    add_header Referrer-Policy $app_referrer_policy always;
    add_header Permissions-Policy $app_permissions_policy always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # With the port, so the services' cross-origin check can compare it with Origin.
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-Id $forwarded_request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The trailing slash on proxy_pass strips the prefix: /api/auth/v1/x reaches auth as /v1/x.
    location /api/auth/ {
        proxy_pass ${AUTH_UPSTREAM}/;
    }

    location /api/user/ {
        proxy_pass ${USER_UPSTREAM}/;
    }

    # RFC 8414 puts an issuer's metadata under /.well-known/, followed by the
    # issuer's path (/api/auth); the auth service serves it at its own root.
    location = /.well-known/oauth-authorization-server/api/auth {
        proxy_pass ${AUTH_UPSTREAM}/.well-known/oauth-authorization-server;
    }

    # Hashed build output: a missing file is a 404, never the app shell.
    location /assets/ {
        try_files $uri =404;
    }

    # History fallback: every other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}
